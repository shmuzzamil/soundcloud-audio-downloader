version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: soundfetch-app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_BRAND_NAME=SoundFetch
      - NEXT_PUBLIC_SITE_URL=https://soundfetch.app
      - NEXT_PUBLIC_SUPPORT_EMAIL=support@soundfetch.app
      - SOUNDCLOUD_CLIENT_ID=${SOUNDCLOUD_CLIENT_ID}
      - SOUNDCLOUD_CLIENT_SECRET=${SOUNDCLOUD_CLIENT_SECRET}
      - RATE_LIMIT_MAX_REQUESTS=30
      - RATE_LIMIT_WINDOW_MS=60000
      - MAX_CONCURRENT_DOWNLOADS=12
      - NEXT_PUBLIC_ENABLE_ADS=false

